<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explore Cities | AfterGlowAve</title><style>:root{font-family:system-ui,sans-serif;color:#fff;background:#170a26;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main,header,footer{max-width:1000px;margin:auto;padding:1.25rem}a{color:#7cf9e6}input,select{font:inherit;padding:.7rem;background:#2b163e;color:white;border:1px solid #8e68a6;border-radius:10px;width:100%;max-width:450px}label{display:block;margin:.8rem 0 .35rem}ul{padding:0;list-style:none;display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}li{background:#321745;padding:1rem;border-radius:13px;border:1px solid #70438c}h1{font-size:clamp(2rem,5vw,3rem)}.small{color:#dfcce6}a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77f7e8;outline-offset:3px}</style><style>.aga-page-logo{display:inline-block;width:clamp(120px,24vw,210px);height:auto;vertical-align:middle;object-fit:contain;filter:drop-shadow(0 0 13px #ee33ad4b)}@media(max-width:500px){.aga-page-logo{width:clamp(96px,28vw,150px)}}</style></head><body><header><a href="index.html"><img class="aga-page-logo" src="assets/aga-neon.webp" width="680" height="375" alt="AGA logo"> ← AfterGlowAve Home</a></header><main><h1>Explore Cities</h1><p>Browse sample destinations by country and city. Live clubs and room bookings are not connected in this preview.</p><label for="country">Country</label><select id="country"><option value="">All countries</option></select><label for="search">Find a city</label><input id="search" type="search" placeholder="Search by city or state" autocomplete="off"><p id="count" role="status" aria-live="polite"></p><ul id="results"></ul><p id="empty" hidden>No matching locations. Try a different search or country.</p></main><footer class="small">AGA City Directory · Preview listings</footer><script>
(()=>{'use strict';const data=[
['Canada','Ontario','Toronto'],['Canada','Quebec','Montreal'],['France','Île-de-France','Paris'],['Germany','Berlin','Berlin'],['Jamaica','Kingston','Kingston'],['Japan','Tokyo','Tokyo'],['Nigeria','Lagos','Lagos'],['South Korea','Seoul','Seoul'],['United Kingdom','England','London'],['United States','California','Los Angeles'],['United States','Florida','Miami'],['United States','Georgia','Atlanta'],['United States','Illinois','Chicago'],['United States','Nevada','Las Vegas'],['United States','New York','Brooklyn'],['United States','New York','New York City'],['United States','North Carolina','Charlotte'],['United States','Texas','Houston']
].sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1])||a[2].localeCompare(b[2]));
const country=document.getElementById('country'),search=document.getElementById('search'),results=document.getElementById('results');
[...new Set(data.map(row=>row[0]))].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;country.append(o);});
function update(){const term=search.value.trim().toLocaleLowerCase(),matches=data.filter(([c,s,city])=>(!country.value||country.value===c)&&[c,s,city].some(x=>x.toLocaleLowerCase().includes(term)));results.replaceChildren();for(const [c,s,city] of matches){const li=document.createElement('li'),strong=document.createElement('strong'),small=document.createElement('div');strong.textContent=city;small.textContent=s+' · '+c;small.className='small';li.append(strong,small);results.append(li);}document.getElementById('count').textContent=matches.length+' locations shown.';document.getElementById('empty').hidden=matches.length!==0;}
country.addEventListener('change',update);search.addEventListener('input',update);update();})();
</script></body></html>
