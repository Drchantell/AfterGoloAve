name: Build AGA iOS simulator
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Compile for iOS Simulator
        run: |
          xcodebuild -project AfterGlowAve.xcodeproj -scheme AfterGlowAve -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent AfterGlowAve.app "$GITHUB_WORKSPACE/AfterGlowAve-iOS-Simulator.zip"
      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: AfterGlowAve-iOS-Simulator
          path: AfterGlowAve-iOS-Simulator.zip
          if-no-files-found: error
