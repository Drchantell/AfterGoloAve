name: AfterGlowAve
options:
  bundleIdPrefix: com.afterglowave
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AfterGlowAve:
    type: application
    platform: iOS
    sources:
      - path: ios/AfterGlowAve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afterglowave.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AfterGlowAve
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGNING_ALLOWED: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
